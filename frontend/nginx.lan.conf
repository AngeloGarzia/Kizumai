server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Vite base=/kizumai/ : strip le préfixe puis re-match location /
  # (rewrite ... last, pas break — sinon try_files renvoie toujours index.html)
  location /kizumai/ {
    rewrite ^/kizumai/(.*)$ /$1 last;
  }

  location = /kizumai {
    return 301 /kizumai/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets hashés : 404 si absents (pas de fallback HTML → erreur MIME)
  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
}
