server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # API backend (Express monté sur /api)
  location /kizumai/api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Frontend React (build Vite avec base /kizumai/)
  location /kizumai/ {
    proxy_pass http://web:8080/kizumai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /kizumai {
    return 301 /kizumai/;
  }

  # Anciens chemins absolus (/kizumai.png) — compat navigateur / cache
  location = /kizumai.png {
    return 302 /kizumai/kizumai.png;
  }
  location = /fabulous.svg {
    return 302 /kizumai/fabulous.svg;
  }
  location = /icon.svg {
    return 302 /kizumai/icon.svg;
  }
  location = /manifest.webmanifest {
    return 302 /kizumai/manifest.webmanifest;
  }
}
