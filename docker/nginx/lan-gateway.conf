# Docker DNS embarqué — re-résout api/web après recreate (évite 502 gateway figé).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # API backend (Express monté sur /api)
  # Avec variables dans proxy_pass, la réécriture de chemin automatique est désactivée :
  # on strip /kizumai/api → /api via rewrite.
  location /kizumai/api/ {
    set $api_upstream api;
    rewrite ^/kizumai/api/(.*)$ /api/$1 break;
    proxy_pass http://$api_upstream:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Frontend React — passer l’URI client intacte ($request_uri).
  location /kizumai/ {
    set $web_upstream web;
    proxy_pass http://$web_upstream:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /kizumai {
    return 301 /kizumai/;
  }

  # Anciens chemins absolus (/kizumai.png) — compat navigateur / cache
  location = /kizumai.png {
    return 302 /kizumai/kizumai.png;
  }
  location = /fabulous.svg {
    return 302 /kizumai/fabulous.svg;
  }
  location = /icon.svg {
    return 302 /kizumai/icon.svg;
  }
  location = /manifest.webmanifest {
    return 302 /kizumai/manifest.webmanifest;
  }
}
