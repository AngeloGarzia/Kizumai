# Docker DNS embarqué — re-résout api/web après recreate (évite 502 gateway figé).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # API backend (Express monté sur /api)
  location /kizumai/api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Frontend React (build Vite avec base /kizumai/)
  location /kizumai/ {
    set $web_upstream web:8080;
    proxy_pass http://$web_upstream/kizumai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /kizumai {
    return 301 /kizumai/;
  }

  # Anciens chemins absolus (/kizumai.png) — compat navigateur / cache
  location = /kizumai.png {
    return 302 /kizumai/kizumai.png;
  }
  location = /fabulous.svg {
    return 302 /kizumai/fabulous.svg;
  }
  location = /icon.svg {
    return 302 /kizumai/icon.svg;
  }
  location = /manifest.webmanifest {
    return 302 /kizumai/manifest.webmanifest;
  }
}
