name: kizumai

services:
  postgres:
    image: postgres:16-alpine
    container_name: kizumai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kizumai
      POSTGRES_PASSWORD: kizumai
      POSTGRES_DB: kizumai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kizumai -d kizumai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kizumai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
