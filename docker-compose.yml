services:
  postgres:
    image: postgres:16-alpine
    container_name: myrokay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myrokay
      POSTGRES_PASSWORD: myrokay
      POSTGRES_DB: myrokay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myrokay -d myrokay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
